[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "uwqsc-backtester"
version = "0.1.0"
description = "UWQSC backtester: market data and sentiment sync, algorithms, CLI and dashboard."
requires-python = ">=3.12"

dependencies = [
    "pandas~=2.2",
    "numpy~=1.26",
    "yfinance>=0.2.54,<0.3",
    "streamlit>=1.43",
    "pyarrow>=15",
]

[project.scripts]
uwqsc = "uwqsc.cli.core:main"

[tool.hatch.build.targets.wheel]
packages = ["uwqsc"]

[tool.hatch.build.hooks.polylith-bricks]

[tool.polylith.bricks]
"../../bases/uwqsc/cli" = "uwqsc/cli"
"../../bases/uwqsc/dashboard" = "uwqsc/dashboard"
"../../components/uwqsc/common" = "uwqsc/common"
"../../components/uwqsc/storage" = "uwqsc/storage"
"../../components/uwqsc/algorithm_core" = "uwqsc/algorithm_core"
"../../components/uwqsc/algorithms" = "uwqsc/algorithms"
"../../components/uwqsc/market_data" = "uwqsc/market_data"
"../../components/uwqsc/sentiment" = "uwqsc/sentiment"
"../../components/uwqsc/backtesting" = "uwqsc/backtesting"
