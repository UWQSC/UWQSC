# Checks brick boundaries, runs the tests with coverage and lints, on Python 3.12 via uv.
name: CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Check Polylith workspace
        run: uv run poly check
      - name: Test
        run: uv run pytest --cov=components --cov=bases --cov-report=term-missing
      - name: Pylint
        run: |
          uv run pylint \
            --fail-under=7.0 \
            --max-args=10 \
            --max-positional-arguments=10 \
            --max-attributes=10 \
            components bases test development
